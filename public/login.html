<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CATMA Safe México - Iniciar Sesión</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.3);
            border-radius: 1rem;
            width: 100%;
            max-width: 400px;
            background-color: #ffffff;
        }
        /* Ajuste específico para el logo */
        .logo-img {
            max-width: 120px; /* Ajusta este tamaño según necesites */
            height: auto;
            margin-bottom: 15px;
        }
        .btn-primary { background-color: #0f172a; border-color: #0f172a; }
        .btn-primary:hover { background-color: #1e293b; border-color: #1e293b; }
    </style>
</head>
<body>

<div class="card login-card p-4">
    <div class="text-center mb-4">
        <!-- AQUÍ SE CAMBIÓ EL ICONO POR TU LOGO -->
        <img src="images/Logo web.png" alt="CATMA Safe Logo" class="logo-img">
        <p class="text-muted small">Portal Operativo de Servicios</p>
    </div>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label fw-bold small text-secondary">Usuario:</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                <input type="text" class="form-control" id="nombre_usuario" name="nombre_usuario" required placeholder="Nombre de usuario">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold small text-secondary">Contraseña:</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
            <i class="fa-solid fa-right-to-bracket me-2"></i> Ingresar al Portal
        </button>

        <div id="mensajeError" class="alert alert-danger mt-3 py-2 text-center small d-none" role="alert"></div>
    </form>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const nombre_usuario = document.getElementById('nombre_usuario').value.trim();
        const password = document.getElementById('password').value;
        const alertaError = document.getElementById('mensajeError');

        alertaError.classList.add('d-none');

        try {
                const respuesta = await fetch('https://servicios.catma.mx/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre_usuario, password })
            });

            if (respuesta.ok) {
                const datos = await respuesta.json();
                localStorage.setItem('usuarioLogueado', datos.usuario);
                localStorage.setItem('rolUsuario', datos.rol);
                window.location.href = '/';
            } else {
                const errorTexto = await respuesta.text();
                alertaError.innerText = errorTexto || 'Credenciales incorrectas.';
                alertaError.classList.remove('d-none');
            }
        } catch (error) {
            console.error('Error en el login:', error);
            alertaError.innerText = 'Error de conexión con el servidor.';
            alertaError.classList.remove('d-none');
        }
    });
</script>
</body>
</html>
